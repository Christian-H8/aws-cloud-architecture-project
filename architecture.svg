<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#445"/>
    </marker>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97a00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="30" text-anchor="middle" font-size="23" font-weight="700" fill="#1a2b3c">Project 1 — AWS Architecture (Phases 1–6)</text>
  <text x="640" y="51" text-anchor="middle" font-size="12.5" fill="#5a6b7c">us-east-2 (Ohio) · web tier (left) · event-driven automation (right)</text>

  <rect x="40" y="70" width="150" height="36" rx="8" fill="#eceff1" stroke="#90a4ae"/>
  <text x="115" y="93" text-anchor="middle" font-size="13" fill="#37474f">Internet Users</text>

  <rect x="975" y="66" width="265" height="42" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-dasharray="6 4"/>
  <text x="1107" y="84" text-anchor="middle" font-size="12" fill="#757575">Route 53 + CloudFront</text>
  <text x="1107" y="99" text-anchor="middle" font-size="11" fill="#9e9e9e">Phase 7 — deferred (S3 origin, no ALB)</text>

  <rect x="30" y="122" width="1220" height="580" rx="14" fill="#f4f8fd" stroke="#2a6ebb" stroke-width="2"/>
  <text x="50" y="146" font-size="13.5" font-weight="700" fill="#2a6ebb">AWS Cloud · us-east-2</text>

  <rect x="330" y="160" width="140" height="32" rx="6" fill="#dbeafe" stroke="#2a6ebb"/>
  <text x="400" y="181" text-anchor="middle" font-size="12.5" fill="#1a3a5c">Internet Gateway</text>

  <!-- ===== VPC (web tier) ===== -->
  <rect x="55" y="200" width="665" height="455" rx="10" fill="#eef4ff" stroke="#3b7dd8" stroke-width="1.5"/>
  <text x="72" y="221" font-size="12.5" font-weight="700" fill="#3b7dd8">VPC project1-vpc · 10.0.0.0/16</text>

  <rect x="95" y="234" width="590" height="38" rx="6" fill="#fff3e0" stroke="#e08a00"/>
  <text x="390" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#9a5b00">Application Load Balancer (project1-alb)</text>

  <rect x="75" y="288" width="310" height="350" rx="8" fill="#ffffff" stroke="#9bbce6" stroke-dasharray="5 4"/>
  <text x="88" y="307" font-size="12" font-weight="600" fill="#5a7fb0">AZ us-east-2a</text>
  <rect x="405" y="288" width="300" height="350" rx="8" fill="#ffffff" stroke="#9bbce6" stroke-dasharray="5 4"/>
  <text x="418" y="307" font-size="12" font-weight="600" fill="#5a7fb0">AZ us-east-2b</text>

  <rect x="90" y="315" width="280" height="58" rx="6" fill="#e9f7ef" stroke="#4caf7d"/>
  <text x="100" y="331" font-size="11" font-weight="600" fill="#2e7d52">Public subnet 10.0.1.0/24</text>
  <rect x="105" y="335" width="150" height="30" rx="5" fill="#ffffff" stroke="#4caf7d"/>
  <text x="180" y="355" text-anchor="middle" font-size="11.5" fill="#2e7d52">NAT Gateway + EIP</text>

  <rect x="420" y="315" width="270" height="58" rx="6" fill="#e9f7ef" stroke="#4caf7d"/>
  <text x="430" y="331" font-size="11" font-weight="600" fill="#2e7d52">Public subnet 10.0.2.0/24</text>

  <rect x="90" y="382" width="280" height="248" rx="6" fill="#fdecef" stroke="#d9788f"/>
  <text x="100" y="622" font-size="11" font-weight="600" fill="#b04a63">Private subnet 10.0.3.0/24</text>
  <rect x="420" y="382" width="270" height="248" rx="6" fill="#fdecef" stroke="#d9788f"/>
  <text x="430" y="622" font-size="11" font-weight="600" fill="#b04a63">Private subnet 10.0.4.0/24</text>

  <rect x="103" y="406" width="600" height="66" rx="8" fill="none" stroke="#7b52c9" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="403" y="400" text-anchor="middle" font-size="11" font-weight="600" fill="#7b52c9">Auto Scaling Group (project1-asg) · target tracking 50% CPU · LT project1-lt</text>

  <rect x="115" y="420" width="230" height="42" rx="6" fill="#ede7f6" stroke="#7b52c9"/>
  <text x="230" y="446" text-anchor="middle" font-size="12.5" fill="#4a2d80">EC2 web server</text>
  <rect x="440" y="420" width="250" height="42" rx="6" fill="#ede7f6" stroke="#7b52c9"/>
  <text x="565" y="446" text-anchor="middle" font-size="12.5" fill="#4a2d80">EC2 web server</text>

  <rect x="115" y="545" width="230" height="42" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="230" y="571" text-anchor="middle" font-size="12.5" fill="#0d47a1">RDS primary</text>
  <rect x="440" y="545" width="250" height="42" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="565" y="571" text-anchor="middle" font-size="12.5" fill="#0d47a1">RDS standby</text>
  <text x="392" y="528" text-anchor="middle" font-size="10.5" fill="#0d47a1">RDS Multi-AZ</text>

  <!-- ===== event-driven (right): upload chain on top, stop chain below ===== -->
  <rect x="775" y="232" width="415" height="48" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="982" y="252" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b5e20">S3 bucket (Phase 2) — shared storage</text>
  <text x="982" y="269" text-anchor="middle" font-size="10" fill="#2e7d32">versioned · encrypted · lifecycle · app uploads via EC2 instance role (Phase 4)</text>

  <rect x="775" y="308" width="195" height="46" rx="6" fill="#fff3d6" stroke="#e0920a"/>
  <text x="872" y="329" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5800">SQS queue</text>
  <text x="872" y="344" text-anchor="middle" font-size="10" fill="#a86a1a">project1-upload-queue</text>

  <rect x="995" y="308" width="195" height="46" rx="6" fill="#fff3d6" stroke="#e0920a"/>
  <text x="1092" y="329" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5800">Lambda</text>
  <text x="1092" y="344" text-anchor="middle" font-size="10" fill="#a86a1a">project1-upload-processor</text>

  <rect x="995" y="384" width="195" height="42" rx="6" fill="#ffffff" stroke="#e0920a"/>
  <text x="1092" y="410" text-anchor="middle" font-size="12" fill="#8a5800">CloudWatch Logs</text>

  <rect x="775" y="498" width="195" height="46" rx="6" fill="#fff3d6" stroke="#e0920a"/>
  <text x="872" y="519" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5800">Lambda</text>
  <text x="872" y="534" text-anchor="middle" font-size="10" fill="#a86a1a">project1-ec2-stopper</text>

  <rect x="995" y="498" width="195" height="46" rx="6" fill="#fff3d6" stroke="#e0920a"/>
  <text x="1092" y="519" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5800">EventBridge Scheduler</text>
  <text x="1092" y="534" text-anchor="middle" font-size="10" fill="#a86a1a">project1_nightly_stop · 04:00 UTC</text>

  <!-- observability full-width band -->
  <rect x="55" y="663" width="1135" height="34" rx="8" fill="#fce4ec" stroke="#c2185b"/>
  <text x="622" y="685" text-anchor="middle" font-size="11.5" font-weight="600" fill="#880e4f">Observability &amp; governance (cross-cutting): CloudWatch · SNS · CloudTrail · AWS Budgets · VPC Flow Logs (Phases 1–3)</text>

  <!-- ===== connectors (orthogonal) ===== -->
  <path d="M115,106 L115,140 L400,140 L400,160" fill="none" stroke="#445" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M1107,108 L1107,142 L420,142 L420,160" fill="none" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M400,192 L400,234" fill="none" stroke="#445" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M230,272 L230,420" fill="none" stroke="#445" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M565,272 L565,420" fill="none" stroke="#445" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M230,462 L230,545" fill="none" stroke="#1976d2" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M565,462 L565,545" fill="none" stroke="#1976d2" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M345,566 L440,566" fill="none" stroke="#1976d2" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M180,420 L180,365" fill="none" stroke="#2e7d52" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M180,335 L180,212 L380,212 L380,192" fill="none" stroke="#2e7d52" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- upload chain: S3 -> SQS -> processor -> Logs -->
  <path d="M872,280 L872,308" fill="none" stroke="#d97a00" stroke-width="1.8" marker-end="url(#arrow6)"/>
  <text x="915" y="297" font-size="10.5" fill="#b36b00">PUT event</text>
  <path d="M970,331 L995,331" fill="none" stroke="#d97a00" stroke-width="1.8" marker-end="url(#arrow6)"/>
  <path d="M1092,354 L1092,384" fill="none" stroke="#d97a00" stroke-width="1.8" marker-end="url(#arrow6)"/>

  <!-- stop chain: EventBridge -> stopper -> ASG -->
  <path d="M995,521 L972,521" fill="none" stroke="#d97a00" stroke-width="1.8" marker-end="url(#arrow6)"/>
  <path d="M775,521 L748,521 L748,441 L705,441" fill="none" stroke="#d97a00" stroke-width="1.8" marker-end="url(#arrow6)"/>
  <text x="773" y="475" text-anchor="middle" font-size="10" fill="#b36b00">nightly stop</text>

  <!-- legend -->
  <rect x="40" y="707" width="13" height="13" rx="3" fill="#fff3d6" stroke="#e0920a"/>
  <text x="60" y="718" font-size="11" fill="#5a6b7c">Phase 6 additions (Lambda · SQS · EventBridge)</text>
  <text x="1240" y="718" text-anchor="end" font-size="10.5" fill="#9e9e9e">github.com/Christian-H8/aws-cloud-architecture-project</text>
</svg>

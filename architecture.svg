<text x="205" y="501" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">0.0.0.0/0 &#8594; IGW &#183; 10.0.0.0/16 &#8594; local</text>

<!-- VPC Flow Logs -->
<rect x="40" y="532" width="330" height="48" rx="8" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="0.5"/>
<text x="205" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#0F766E" dominant-baseline="central">VPC Flow Logs</text>
<text x="205" y="566" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">&#8594; CloudWatch /vpc/project1-flowlogs</text>


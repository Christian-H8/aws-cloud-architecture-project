<text x="586" y="501" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">0.0.0.0/0 &#8594; NAT &#183; 10.0.0.0/16 &#8594; local</text>

<!-- Private isolation label -->
<rect x="412" y="532" width="348" height="48" rx="8" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="0.5"/>

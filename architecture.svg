<text x="493" y="302" text-anchor="middle" font-size="12" fill="#6D28D9" dominant-baseline="central">private-1a</text>
<text x="493" y="317" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">10.0.3.0/24</text>
<rect x="422" y="333" width="142" height="58" rx="6" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="0.5"/>

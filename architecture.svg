<svg width="800" height="760" viewBox="0 0 800 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif">

<defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowdash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arroworange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#FB923C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Internet -->
<rect x="300" y="20" width="200" height="44" rx="22" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="0.5"/>
<text x="400" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#374151" dominant-baseline="central">Internet</text>

<!-- Arrow: Internet -> IGW -->
<line x1="400" y1="64" x2="400" y2="93" stroke="#6B7280" stroke-width="1" marker-end="url(#arrowhead)"/>

<!-- Internet Gateway -->
<rect x="295" y="95" width="210" height="54" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="0.5"/>

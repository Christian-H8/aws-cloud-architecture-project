<rect x="212" y="412" width="158" height="44" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="291" y="425" text-anchor="middle" font-size="11" font-weight="600" fill="#9A3412" dominant-baseline="central">Target tracking &#183; 50% CPU</text>
<text x="291" y="441" text-anchor="middle" font-size="10" fill="#9A3412" dominant-baseline="central">CloudWatch: AlarmHigh / AlarmLow</text>

<!-- Dashed launch arrows: launch template -> ASG, target tracking -> ASG -->
<path d="M 118 412 L 118 405 L 200 405 L 200 354" fill="none" stroke="#FB923C" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arroworange)"/>
<path d="M 291 412 L 291 405 L 212 405 L 212 354" fill="none" stroke="#FB923C" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arroworange)"/>


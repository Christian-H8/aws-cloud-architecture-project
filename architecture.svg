<svg width="800" height="620" viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif">

<defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowdash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Internet -->
<rect x="300" y="20" width="200" height="44" rx="22" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="0.5"/>
<text x="400" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#374151" dominant-baseline="central">Internet</text>

<!-- Arrow: Internet → IGW -->
<line x1="400" y1="64" x2="400" y2="93" stroke="#6B7280" stroke-width="1" marker-end="url(#arrowhead)"/>

<!-- Internet Gateway -->
<rect x="295" y="95" width="210" height="54" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="0.5"/>
<text x="400" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#1E40AF" dominant-baseline="central">Internet gateway</text>
<text x="400" y="131" text-anchor="middle" font-size="11" fill="#3B82F6" dominant-baseline="central">project1-igw</text>

<!-- Arrow: IGW → VPC -->
<line x1="400" y1="149" x2="400" y2="170" stroke="#6B7280" stroke-width="1" marker-end="url(#arrowhead)"/>

<!-- VPC outer container -->
<rect x="16" y="172" width="768" height="356" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.5"/>
<text x="400" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#1E40AF" dominant-baseline="central">project1-vpc — 10.0.0.0/16</text>

<!-- Public subnet zone -->
<rect x="28" y="208" width="356" height="304" rx="12" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="0.5"/>
<text x="206" y="226" text-anchor="middle" font-size="12" fill="#0F766E" dominant-baseline="central">Public subnets (us-east-2a · us-east-2b)</text>

<!-- Subnet public-2a -->
<rect x="40" y="238" width="156" height="96" rx="8" fill="white" stroke="#A7F3D0" stroke-width="0.5"/>
<text x="118" y="256" text-anchor="middle" font-size="12" fill="#0F766E" dominant-baseline="central">public-2a</text>
<text x="118" y="271" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">10.0.1.0/24</text>
<rect x="50" y="283" width="136" height="36" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="0.5"/>
<text x="118" y="301" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E" dominant-baseline="central">EC2 instance</text>

<!-- Subnet public-2b -->
<rect x="212" y="238" width="158" height="96" rx="8" fill="white" stroke="#A7F3D0" stroke-width="0.5"/>
<text x="291" y="256" text-anchor="middle" font-size="12" fill="#0F766E" dominant-baseline="central">public-2b</text>
<text x="291" y="271" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">10.0.2.0/24</text>
<rect x="222" y="283" width="138" height="36" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.5"/>
<text x="291" y="301" text-anchor="middle" font-size="13" font-weight="600" fill="#9A3412" dominant-baseline="central">NAT gateway</text>

<!-- Public route table -->
<rect x="40" y="350" width="330" height="52" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="205" y="367" text-anchor="middle" font-size="13" font-weight="600" fill="#374151" dominant-baseline="central">Public route table</text>
<text x="205" y="385" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">0.0.0.0/0 → IGW · 10.0.0.0/16 → local</text>

<!-- VPC Flow Logs -->
<rect x="40" y="418" width="330" height="48" rx="8" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="0.5"/>
<text x="205" y="436" text-anchor="middle" font-size="13" font-weight="600" fill="#0F766E" dominant-baseline="central">VPC Flow Logs</text>
<text x="205" y="452" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">→ CloudWatch /vpc/project1-flowlogs</text>

<!-- Dashed arrow: NAT → private zone -->
<line x1="384" y1="301" x2="398" y2="301" stroke="#9CA3AF" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrowdash)"/>

<!-- Private subnet zone -->
<rect x="400" y="208" width="372" height="304" rx="12" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="0.5"/>
<text x="586" y="226" text-anchor="middle" font-size="12" fill="#6D28D9" dominant-baseline="central">Private subnets (us-east-2a · us-east-2b)</text>

<!-- Subnet private-2a -->
<rect x="412" y="238" width="162" height="96" rx="8" fill="white" stroke="#DDD6FE" stroke-width="0.5"/>
<text x="493" y="256" text-anchor="middle" font-size="12" fill="#6D28D9" dominant-baseline="central">private-2a</text>
<text x="493" y="271" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">10.0.3.0/24</text>
<rect x="422" y="283" width="142" height="36" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="493" y="301" text-anchor="middle" font-size="12" fill="#9CA3AF" dominant-baseline="central">Phase 4: RDS</text>

<!-- Subnet private-2b -->
<rect x="592" y="238" width="168" height="96" rx="8" fill="white" stroke="#DDD6FE" stroke-width="0.5"/>
<text x="676" y="256" text-anchor="middle" font-size="12" fill="#6D28D9" dominant-baseline="central">private-2b</text>
<text x="676" y="271" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">10.0.4.0/24</text>
<rect x="602" y="283" width="148" height="36" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="676" y="301" text-anchor="middle" font-size="12" fill="#9CA3AF" dominant-baseline="central">Phase 4: RDS</text>

<!-- Private route table -->
<rect x="412" y="350" width="348" height="52" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="586" y="367" text-anchor="middle" font-size="13" font-weight="600" fill="#374151" dominant-baseline="central">Private route table</text>
<text x="586" y="385" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">0.0.0.0/0 → NAT · 10.0.0.0/16 → local</text>

<!-- Private isolation label -->
<rect x="412" y="418" width="348" height="48" rx="8" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="0.5"/>
<text x="586" y="436" text-anchor="middle" font-size="13" font-weight="600" fill="#6D28D9" dominant-baseline="central">Isolated from internet</text>
<text x="586" y="452" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">no inbound · outbound via NAT only</text>

<!-- Phase 1–2 services row -->
<text x="400" y="552" text-anchor="middle" font-size="11" fill="#9CA3AF" dominant-baseline="central">Phase 1–2 services</text>

<rect x="16" y="562" width="170" height="36" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="101" y="580" text-anchor="middle" font-size="12" fill="#374151" dominant-baseline="central">CloudWatch + SNS</text>

<rect x="202" y="562" width="150" height="36" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="277" y="580" text-anchor="middle" font-size="12" fill="#374151" dominant-baseline="central">S3 + CloudTrail</text>

<rect x="368" y="562" width="140" height="36" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="438" y="580" text-anchor="middle" font-size="12" fill="#374151" dominant-baseline="central">AWS Budgets</text>

<rect x="524" y="562" width="80" height="36" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="564" y="580" text-anchor="middle" font-size="12" fill="#374151" dominant-baseline="central">IAM</text>

<rect x="620" y="562" width="164" height="36" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="0.5"/>
<text x="702" y="580" text-anchor="middle" font-size="12" fill="#374151" dominant-baseline="central">S3 Lifecycle + Versioning</text>

</svg>

<text x="400" y="131" text-anchor="middle" font-size="11" fill="#3B82F6" dominant-baseline="central">project1-igw</text>

<!-- Arrow: IGW -> VPC -->
<line x1="400" y1="149" x2="400" y2="170" stroke="#6B7280" stroke-width="1" marker-end="url(#arrowhead)"/>

<!-- VPC outer container -->
<rect x="16" y="172" width="768" height="450" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.5"/>
<text x="400" y="194" text-anchor="middle" font-size="14" font-weight="600" fill="#1E40AF" dominant-baseline="central">project1-vpc &#8212; 10.0.0.0/16</text>

<!-- Public subnet zone -->
<rect x="28" y="208" width="356" height="398" rx="12" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="0.5"/>
<text x="206" y="226" text-anchor="middle" font-size="12" fill="#0F766E" dominant-baseline="central">Public subnets (us-east-2a &#183; us-east-2b)</text>


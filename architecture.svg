<text x="291" y="317" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">10.0.2.0/24</text>
<rect x="222" y="329" width="138" height="36" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="0.5"/>
<text x="291" y="347" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E" dominant-baseline="central">EC2 instance</text>

<!-- Auto Scaling group: two slim wrappers (one per EC2 in each AZ) joined by a connector through the subnet gap. Kept inside each subnet so subnet boundaries stay clear. -->
<rect x="46" y="325" width="144" height="46" rx="8" fill="none" stroke="#FB923C" stroke-width="1.2" stroke-dasharray="5 3"/>
<rect x="218" y="325" width="146" height="46" rx="8" fill="none" stroke="#FB923C" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="190" y1="348" x2="218" y2="348" stroke="#FB923C" stroke-width="1.2" stroke-dasharray="5 3"/>

<!-- Launch Template tile -->
<rect x="40" y="412" width="156" height="44" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="118" y="427" text-anchor="middle" font-size="12" font-weight="600" fill="#9A3412" dominant-baseline="central">Launch template</text>
<text x="118" y="442" text-anchor="middle" font-size="10" fill="#9A3412" dominant-baseline="central">project1-lt v1 &#8594; project1-asg</text>


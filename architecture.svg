<text x="676" y="317" text-anchor="middle" font-size="11" fill="#6B7280" dominant-baseline="central">10.0.4.0/24</text>
<rect x="602" y="333" width="148" height="58" rx="6" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="0.5"/>
